# Illustrative Nginx configuration snippet.
# Adapt and test for your application before production use.
# Configure TLS certificates and HTTP-to-HTTPS redirects separately.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# Example only: tailor CSP directives to the application's actual scripts,
# styles, images, APIs, and other required resources. Avoid blindly copying
# a policy that may break the application.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# Enable HSTS only after HTTPS is correctly configured and verified for the
# relevant domain and all included subdomains.
# add_header Strict-Transport-Security "max-age=31536000" always;
